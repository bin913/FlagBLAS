name: Backend Test

on:
  workflow_call:
    inputs:
      vendor:
        description: 'BLAS_VENDOR value (e.g. nvidia, ascend, moore)'
        required: true
        type: string
      runner_label:
        description: 'GitHub Actions runner label'
        required: true
        type: string
      gpu_check_script:
        description: 'Path to GPU check script (leave empty to skip)'
        required: false
        type: string
        default: ''
      test_script:
        description: "Temporary parameter for alpha-ops test"
        required: false
        type: string
        default: ''
      changed_files:
        description: 'List of changed files in a PR'
        required: false
        type: string
        default: ''
      pr_id:
        description: 'ID of the PR'
        required: false
        type: string
        default: ''

jobs:
  test:
    runs-on: ${{ inputs.runner_label }}
    concurrency:
      group: >-
        op-test-${{ inputs.vendor }}-
        ${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - id: checkout-attempt-1
        uses: actions/checkout@v4
        continue-on-error: true
      - id: sleep-1
        if: steps.checkout-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-2
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
      - id: sleep-2
        if: steps.checkout-attempt-2.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-3
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Setup FlagBLAS
        shell: bash
        env:
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          source tools/set-env.sh ${{ inputs.vendor }}
          ./setup.sh ${{ inputs.vendor }}

      - name: Check GPU availability
        if: ${{ inputs.gpu_check_script != '' }}
        shell: bash
        run: |
          bash ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.vendor }} ${{ inputs.pr_id }}
      - name: Diagnose torch on hygon
        if: ${{ inputs.vendor == 'hygon' && inputs.test_script == '' }}
        shell: bash
        run: |
          set +e
          source .venv/bin/activate
          source tools/set-env.sh hygon
          echo "=== hygon torch diagnose ==="
          echo "DTK_ENV=${DTK_ENV:-<unset>}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-<unset>}"
          echo "--- hy-smi ---"
          command -v hy-smi >/dev/null 2>&1 && hy-smi 2>&1 | head -25 || echo "hy-smi not found"
          python - <<'EOF'
          import sys, os

          def note(kind, title, text):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{kind} title={title}::{text}")

          print("python:", sys.version)
          try:
              import torch
              print("torch:", torch.__version__)
              print("hip:", getattr(torch.version, "hip", None))
              print("cuda:", torch.version.cuda)
              print("cuda available (before init):", torch.cuda.is_available())
              try:
                  torch.cuda.init()
                  print("cuda available (after init):", torch.cuda.is_available())
                  print("device count:", torch.cuda.device_count())
                  if torch.cuda.is_available():
                      print("device name:", torch.cuda.get_device_name(0))
              except Exception:
                  import traceback
                  tb = traceback.format_exc()
                  print(tb)
                  note("error", "torch.cuda.init failed", tb)
          except Exception:
              import traceback
              tb = traceback.format_exc()
              print(tb)
              note("error", "hygon torch import failed", tb)

          print("--- driver / env ---")
          print("/dev/kfd exists:", os.path.exists("/dev/kfd"))
          print("dri:", os.listdir("/dev/dri") if os.path.isdir("/dev/dri") else "no /dev/dri")
          for k in ("DTK_ENV", "HIP_PATH", "ROCM_PATH", "HIP_VISIBLE_DEVICES", "PYTORCH_HIP_ALLOC_CONF"):
              print(f"{k}={os.environ.get(k)!r}")
          print("LD_LIBRARY_PATH=" + os.environ.get("LD_LIBRARY_PATH", ""))
          EOF
          exit 0

      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          source tools/set-env.sh ${{ inputs.vendor }}
          tools/run_op.sh ${{ inputs.pr_id }}
