name: Backend Test

on:
  workflow_call:
    inputs:
      vendor:
        description: 'BLAS_VENDOR value (e.g. nvidia, ascend, moore)'
        required: true
        type: string
      runner_label:
        description: 'GitHub Actions runner label'
        required: true
        type: string
      gpu_check_script:
        description: 'Path to GPU check script (leave empty to skip)'
        required: false
        type: string
        default: ''
      test_script:
        description: "Temporary parameter for alpha-ops test"
        required: false
        type: string
        default: ''
      changed_files:
        description: 'List of changed files in a PR'
        required: false
        type: string
        default: ''
      pr_id:
        description: 'ID of the PR'
        required: false
        type: string
        default: ''

jobs:
  test:
    runs-on: ${{ inputs.runner_label }}
    concurrency:
      group: >-
        op-test-${{ inputs.vendor }}-
        ${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - id: checkout-attempt-1
        uses: actions/checkout@v4
        continue-on-error: true
      - id: sleep-1
        if: steps.checkout-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-2
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
      - id: sleep-2
        if: steps.checkout-attempt-2.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-3
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Setup FlagBLAS
        shell: bash
        env:
          RUNNER_LABEL: ${{ inputs.runner_label }}
        run: |
          source tools/set-env.sh ${{ inputs.vendor }}
          ./setup.sh ${{ inputs.vendor }}

      - name: Check GPU availability
        if: ${{ inputs.gpu_check_script != '' }}
        shell: bash
        run: |
          bash ${{ inputs.gpu_check_script }}

      - name: Test alpha ops
        if: ${{ inputs.test_script != '' }}
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        shell: bash
        run: |
          bash ${{ inputs.test_script }} ${{ inputs.vendor }} ${{ inputs.pr_id }}
      - name: Diagnose torch on hygon
        if: ${{ inputs.vendor == 'hygon' && inputs.test_script == '' }}
        shell: bash
        run: |
          set +e
          source .venv/bin/activate
          source tools/set-env.sh hygon
          python - <<'EOF'
          import sys, os, io, subprocess

          def note(kind, title, text):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::{kind} title={title}::{text}")

          buf = io.StringIO()
          def log(*a):
              line = " ".join(str(x) for x in a)
              print(line)
              buf.write(line + "\n")

          log("=== hygon torch diagnose ===")
          log("python:", sys.version.split()[0])
          try:
              import torch
              log("torch:", torch.__version__)
              log("hip:", getattr(torch.version, "hip", None))
              log("cuda:", torch.version.cuda)
              try:
                  torch.cuda.init()
                  log("cuda after init:", torch.cuda.is_available(),
                      "count:", torch.cuda.device_count())
              except Exception:
                  import traceback
                  log(traceback.format_exc())
          except Exception:
              import traceback
              log(traceback.format_exc())

          log("--- driver / env ---")
          log("/dev/kfd exists:", os.path.exists("/dev/kfd"))
          log("dri:", os.listdir("/dev/dri") if os.path.isdir("/dev/dri") else "no /dev/dri")
          try:
              out = subprocess.run(["hy-smi"], capture_output=True, text=True, timeout=30)
              log("hy-smi rc:", out.returncode)
              log((out.stdout or "")[:2000])
              if out.stderr:
                  log("hy-smi stderr:", out.stderr[:2000])
          except Exception as e:
              log("hy-smi error:", e)
          for k in ("DTK_ENV", "HIP_PATH", "ROCM_PATH", "LD_LIBRARY_PATH"):
              log(k, "=", os.environ.get(k, "<unset>"))

          note("error", "hygon diagnose summary", buf.getvalue())
          EOF
          exit 0

      - name: Run backend tests
        if: ${{ inputs.test_script == '' }}
        shell: bash
        env:
          CHANGED_FILES: ${{ inputs.changed_files }}
        run: |
          source .venv/bin/activate
          source tools/set-env.sh ${{ inputs.vendor }}
          tools/run_op.sh ${{ inputs.pr_id }}
